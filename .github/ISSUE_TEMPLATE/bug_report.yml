name: Bug report / 问题反馈
description: Something did not work as expected.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "English or 中文 is welcome. Please omit conversation logs, project paths and credentials; a small synthetic example is best."
  - type: input
    id: environment
    attributes:
      label: Versions
      description: macOS version, Decaf version or commit, and agent version if relevant.
      placeholder: "macOS …; Decaf …; Claude Code / Codex …"
    validations:
      required: true
  - type: dropdown
    id: tools
    attributes:
      label: Which tools are you using?
      options:
        - Claude Code
        - Codex
        - Both Claude Code and Codex
        - Manual keep-awake only
    validations:
      required: true
  - type: textarea
    id: usage_support
    attributes:
      label: Usage support summary (optional)
      description: "For usage issues in the development preview: open Usage Statistics, click the read-status line, then Copy support summary. It includes app/macOS versions and import status, without token totals, usage dates, paths or conversations. Paste it here if useful."
      render: text
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: What should have happened, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include whether hooks were enabled, if relevant. Screenshots are optional.
    validations:
      required: true
