# XcodeGen manifest — the single source of truth for the Xcode project
# (plan 06 §3). Caffeinate.xcodeproj is generated (Scripts/bootstrap.sh) and
# gitignored. Bundle ID is the frozen-later placeholder dev.caffeinate.app.
name: Caffeinate
options:
  bundleIdPrefix: dev.caffeinate
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  CaffeinateCore:
    path: Core
  # Sparkle: { url: https://github.com/sparkle-project/Sparkle, from: 2.6.0 }  # V1.x
targets:
  Caffeinate:
    type: application
    platform: macOS
    sources:
      - App
    dependencies:
      - package: CaffeinateCore
        product: CaffeinateCore
      - package: CaffeinateCore
        product: AgentDetection
      - package: CaffeinateCore
        product: CaffeinateComposition
      - package: CaffeinateCore
        product: HookWire
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.caffeinate.app
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: App/Caffeinate.entitlements
        # actool merges CFBundleIconName into Info.plist from this; the set is
        # regenerated by Scripts/set-appicon.sh, so the direction stays switchable.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: 0.1.0      # version single source of truth; release.sh reads this
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
    info:
      # XcodeGen generates App/Info.plist from these properties on every
      # `xcodegen generate` — edit here, not the plist.
      path: App/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: Caffeinate
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "© Caffeinate contributors. MIT License."
    postBuildScripts:                  # caff-bridge is a Core package executable product;
      - name: Embed caff-bridge        # build and embed it into Contents/Helpers (plan 06 §3)
        basedOnDependencyAnalysis: false  # must run every build to keep the embedded bridge fresh
        script: |
          set -euo pipefail
          swift build -c release --package-path "$SRCROOT/Core" --product caff-bridge
          HELPERS_DIR="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers"
          mkdir -p "$HELPERS_DIR"
          cp "$SRCROOT/Core/.build/release/caff-bridge" "$HELPERS_DIR/"
          if [ "${CODE_SIGNING_ALLOWED:-YES}" = "YES" ] && [ -n "${EXPANDED_CODE_SIGN_IDENTITY:-}" ]; then
            codesign --force --options runtime --sign "$EXPANDED_CODE_SIGN_IDENTITY" \
              "$HELPERS_DIR/caff-bridge"
          fi
    scheme:
      # So `xcodebuild -scheme Caffeinate test` runs the app-layer tests. The app
      # is still the scheme's build target; the test bundle only joins its test
      # action.
      testTargets:
        - CaffeinateAppTests

  # The app target's unit tests. Every audit flagged that App/ had none, while
  # the layer does own real logic: the strings the menu prints and the image the
  # menu bar shows.
  #
  # Deliberately a LOGIC test bundle with no TEST_HOST. A hosted bundle would
  # launch Caffeinate.app to inject into, and `applicationDidFinishLaunching`
  # runs the whole product: the single-instance socket bind, the hooks probe
  # against the developer's REAL ~/.claude, the login-item registration and the
  # onboarding window. None of that is needed to test a pure function, and a
  # test suite that reads and could write a user's live agent config is not a
  # trade worth making.
  #
  # The price of that choice is this `sources` list: the two App files under
  # test are compiled into the bundle directly. It is why MenuTextFormatter
  # lives in its own file rather than beside MenuContentView — a SwiftUI scene
  # would drag AppEnvironment and a live CompositionRoot in with it. Adding a
  # file here is the deliberate act of declaring it free of app-launch
  # side effects.
  CaffeinateAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - AppTests
      - path: App/MenuTextFormatter.swift
        group: App
      - path: App/IconRenderer.swift
        group: App
    dependencies:
      - package: CaffeinateCore
        product: CaffeinateCore
      - package: CaffeinateCore
        product: HookWire
    settings:
      base:
        # Derived from the app's placeholder bundle ID; when that is frozen
        # (author decision 2, docs/launch/README-REVIEW.md §2) this moves with
        # it. Nothing ships it — a logic test bundle is never distributed.
        PRODUCT_BUNDLE_IDENTIFIER: dev.caffeinate.app.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        # No TEST_HOST / BUNDLE_LOADER on purpose — see the note above.
