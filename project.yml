# XcodeGen manifest — the single source of truth for the Xcode project
# (plan 06 §3). Decaf.xcodeproj is generated (Scripts/bootstrap.sh) and
# gitignored. Bundle ID is frozen: io.github.alany1an.decaf (author decision,
# 2026-08-07, taken together with the Caffeinate → Decaf rename).
name: Decaf
options:
  bundleIdPrefix: io.github.alany1an
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  DecafCore:
    path: Core
  # Sparkle: { url: https://github.com/sparkle-project/Sparkle, from: 2.6.0 }  # V1.x
targets:
  Decaf:
    type: application
    platform: macOS
    sources:
      - App
    dependencies:
      - package: DecafCore
        product: DecafCore
      - package: DecafCore
        product: AgentDetection
      - package: DecafCore
        product: DecafComposition
      - package: DecafCore
        product: HookWire
      - package: DecafCore
        product: UsageMetering
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.alany1an.decaf
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: App/Decaf.entitlements
        # actool merges CFBundleIconName into Info.plist from this; the set is
        # regenerated by Scripts/set-appicon.sh, so the direction stays switchable.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: 0.1.0      # version single source of truth; release.sh reads this
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
    info:
      # XcodeGen generates App/Info.plist from these properties on every
      # `xcodegen generate` — edit here, not the plist.
      path: App/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: Decaf
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "© 2026 AlanY1an. MIT License."
    postBuildScripts:                  # decaf-bridge and decaf-statusline are Core package
      - name: Embed helper binaries     # executable products; build and embed them into
        basedOnDependencyAnalysis: false  # Contents/Helpers (plan 06 §3, plan 09 M3b).
        script: |                         # must run every build to keep the embedded copies fresh
          set -euo pipefail
          swift build -c release --package-path "$SRCROOT/Core" --product decaf-bridge
          swift build -c release --package-path "$SRCROOT/Core" --product decaf-statusline
          HELPERS_DIR="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers"
          mkdir -p "$HELPERS_DIR"
          cp "$SRCROOT/Core/.build/release/decaf-bridge" "$HELPERS_DIR/"
          cp "$SRCROOT/Core/.build/release/decaf-statusline" "$HELPERS_DIR/"
          if [ "${CODE_SIGNING_ALLOWED:-YES}" = "YES" ] && [ -n "${EXPANDED_CODE_SIGN_IDENTITY:-}" ]; then
            codesign --force --options runtime --sign "$EXPANDED_CODE_SIGN_IDENTITY" \
              "$HELPERS_DIR/decaf-bridge"
            codesign --force --options runtime --sign "$EXPANDED_CODE_SIGN_IDENTITY" \
              "$HELPERS_DIR/decaf-statusline"
          fi
    scheme:
      # So `xcodebuild -scheme Decaf test` runs the app-layer tests. The app
      # is still the scheme's build target; the test bundle only joins its test
      # action.
      testTargets:
        - DecafAppTests

  # The app target's unit tests. Every audit flagged that App/ had none, while
  # the layer does own real logic: the strings the menu prints and the image the
  # menu bar shows.
  #
  # Deliberately a LOGIC test bundle with no TEST_HOST. A hosted bundle would
  # launch Decaf.app to inject into, and `applicationDidFinishLaunching`
  # runs the whole product: the single-instance socket bind, the hooks probe
  # against the developer's REAL ~/.claude, the login-item registration and the
  # onboarding window. None of that is needed to test a pure function, and a
  # test suite that reads and could write a user's live agent config is not a
  # trade worth making.
  #
  # The price of that choice is this `sources` list: the two App files under
  # test are compiled into the bundle directly. It is why MenuTextFormatter
  # lives in its own file rather than beside MenuContentView — a SwiftUI scene
  # would drag AppEnvironment and a live CompositionRoot in with it. Adding a
  # file here is the deliberate act of declaring it free of app-launch
  # side effects.
  DecafAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - AppTests
      - path: App/MenuTextFormatter.swift
        group: App
      - path: App/MenuLayout.swift
        group: App
      - path: App/IconRenderer.swift
        group: App
    dependencies:
      - package: DecafCore
        product: DecafCore
      - package: DecafCore
        product: HookWire
    settings:
      base:
        # Derived from the app's frozen bundle ID; it moves with it. Nothing
        # ships it — a logic test bundle is never distributed.
        PRODUCT_BUNDLE_IDENTIFIER: io.github.alany1an.decaf.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        # No TEST_HOST / BUNDLE_LOADER on purpose — see the note above.
