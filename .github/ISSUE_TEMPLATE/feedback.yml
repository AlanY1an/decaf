name: First-day feedback / 试用反馈
description: Tell us how Decaf fit into a real workday.
title: "[Feedback] "
body:
  - type: markdown
    attributes:
      value: "A few sentences are enough. No usage totals or session logs are required. English or 中文 is welcome."
  - type: dropdown
    id: tools
    attributes:
      label: Your setup
      options:
        - Claude Code
        - Codex
        - Both Claude Code and Codex
        - Manual keep-awake only
  - type: textarea
    id: experience
    attributes:
      label: What helped, or got in your way?
      description: Mention your Decaf version and whether you use Claude Code, Codex or both. Did the Mac stay awake when expected? Were Daily/Monthly totals and the first import clear? If you tried Move sessions, did the source and destination make sense? A few sentences are enough.
    validations:
      required: true
  - type: dropdown
    id: return
    attributes:
      label: Would you keep using it?
      options:
        - Already using it regularly
        - Still trying it
        - Only for an occasional task
        - Stopped using it
  - type: textarea
    id: improvement
    attributes:
      label: One thing you would change
    validations:
      required: false
